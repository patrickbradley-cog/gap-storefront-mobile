services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gap
      POSTGRES_PASSWORD: gap
      POSTGRES_DB: gap_demo
    ports:
      - "5432:5432"
    volumes:
      - gap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gap -d gap_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gap:gap@db:5432/gap_demo
      PORT: "3000"
    ports:
      - "3000:3000"
    command: sh -c "npm run db:seed && npm run start"

volumes:
  gap_pgdata:
